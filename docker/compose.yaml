services:
  wireguard-hub:
    container_name: wireguard-hub
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_REPO: https://github.com/AetherBreaker/wireguard-hub.git
        GIT_TAG: v0.1.0
    restart: no
    volumes:
      - type: bind
        source: /data/wireguard_hub_files
        target: /app/persisted_data
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/devkit-container
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  coolify:
    external: true
