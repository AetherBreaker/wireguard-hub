services:
  wireguard-hub:
    container_name: wireguard-hub
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        GIT_REPO: https://github.com/AetherBreaker/wireguard-hub.git
        GIT_TAG: v1.5.0
    restart: no
    volumes:
      - type: bind
        source: /data/wireguard_hub_files
        target: /app/persisted_data
    networks:
      - coolify
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/devkit-container
        - healthcheck
      start_period: 15s
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - HEARTBEAT_SLUG=wireguard-hub
      - ALERTS_EMAIL=info@sweetfiretobacco.com
      - ALERTS_EMAIL_PWD=${ALERTS_EMAIL_PWD:?}
      - ALERTS_RECIPIENTS=["jacob.ogden@sweetfiretobacco.com"]
      - WG_HUB_PRIVATE_KEY=${WG_HUB_PRIVATE_KEY:?}
    # The hub's own (hub design 3.6): setup-project never removes a key it does not annotate
    # and only appends to environment, so these survive every re-render.
    cap_add: [NET_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    ports: ["51820:51820/udp"]

networks:
  coolify:
    external: true
